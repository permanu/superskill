name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  # Fast contract/schema check: no toolchains required.
  rules:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: node dist/rules/cli.js validate --no-compile

  # Per-language compile matrix: each pack is validated with its real toolchain.
  # --strict fails the job when a toolchain is missing instead of silently
  # skipping snippet compiles.
  rules-matrix:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        lang: [rust, typescript, python, go, swift, java, c, cpp]
    name: rules (${{ matrix.lang }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Set up Rust
        if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Go
        if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Set up Java
        if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'
      - name: Set up Swift
        if: matrix.lang == 'swift'
        uses: swift-actions/setup-swift@v2
      - name: Set up Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Ensure clang (C/C++)
        if: matrix.lang == 'c' || matrix.lang == 'cpp'
        run: |
          clang --version || { sudo apt-get update && sudo apt-get install -y clang; }
      - name: Cache Rust harness (crate registry + warm target dir)
        if: matrix.lang == 'rust'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.superskill/cache/rust-harness
          key: rust-harness-${{ runner.os }}-${{ hashFiles('src/rules/harness/rust.ts') }}
          restore-keys: |
            rust-harness-${{ runner.os }}-
      - name: Cache Java harness jars
        if: matrix.lang == 'java'
        uses: actions/cache@v4
        with:
          path: ~/.superskill/cache/jars
          key: java-jars-${{ runner.os }}-${{ hashFiles('src/rules/harness/java.ts') }}
          restore-keys: |
            java-jars-${{ runner.os }}-
      - run: npm ci
      - run: npm run build
      - name: Validate ${{ matrix.lang }} pack with compile + strict toolchain
        run: node dist/rules/cli.js validate --lang ${{ matrix.lang }} --strict

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
