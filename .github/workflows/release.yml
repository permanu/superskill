name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
      - name: Validate release tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs --validate
      - run: sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - name: Test scripts and skill evaluations
        shell: bash
        run: |
          shopt -s nullglob
          test_files=(scripts/*.test.mjs scripts/skill-evals/*.test.mjs)
          node --test --test-concurrency=2 "${test_files[@]}"
      - run: npm run build
      - run: node dist/rules/cli.js validate --no-compile
      - run: node scripts/check-skill-authoring.mjs
      - run: npm run verify:grammars
      - run: node scripts/verify-package.mjs
      - run: npm run test:coverage
      - run: docker build -f deploy/Dockerfile -t superskill-restricted:local .
      - run: node scripts/restricted-runtime.smoke.mjs

  github-release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'GitHub release %s already exists — skip\n' "$RELEASE_TAG"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-body.md"
